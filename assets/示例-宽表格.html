<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>示例 · 宽表格卡</title>
<link rel="stylesheet" href="_信息图样式.css">
<style>:root{--sheet-width:1224px}</style>
</head><body>
<!-- 宽表格示例：高密度比较使用更宽画布；标题直接陈述，内容均为占位。 -->
<div class="sheet">
  <div class="hd">
    <div class="kk">COMPARISON</div>
    <div class="tt">
      <h1>三条路径承担不同的能力与边界</h1>
      <p class="sub">先呈现各自角色，再说明连接机制</p>
    </div>
  </div>

  <p class="lede">比较矩阵保留形成结论所需的条件和局限；信息密度超出单页承载能力时继续拆页。</p>

  <div class="tablewrap">
    <table>
      <thead><tr><th>路径</th><th>核心能力</th><th>必要输入</th><th>单独应用的局限</th></tr></thead>
      <tbody>
        <tr><td>路径一</td><td>能力说明占位</td><td>输入条件占位</td><td>局限与适用边界占位</td></tr>
        <tr><td>路径二</td><td>能力说明占位</td><td>输入条件占位</td><td>局限与适用边界占位</td></tr>
        <tr><td>路径三</td><td>能力说明占位</td><td>输入条件占位</td><td>局限与适用边界占位</td></tr>
      </tbody>
    </table>
  </div>

  <div class="note"><b>汇合关系：</b>各路径通过可检查的中间对象形成约束链；具体连接机制应在下一张流程卡展开。</div>
</div>
</body></html>
