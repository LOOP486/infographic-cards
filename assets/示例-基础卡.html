<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>示例 · 基础卡</title>
<link rel="stylesheet" href="_信息图样式.css">
</head><body>
<!-- 基础卡示例：卡头 + 居中导语 + 多栏 + 标签行 + 底部标注。内容为占位。 -->
<div class="sheet">
  <div class="hd">
    <div class="kk">SECTION KEY</div>
    <div class="tt">
      <h1>标题占位</h1>
      <p class="sub">副标题占位 · 一句话说明</p>
    </div>
  </div>

  <p class="lede">这里是居中导语，用一两句话概括本节要点，关键词用 <b>红字强调</b>，其余保持中性墨色。</p>

  <div class="cols" style="margin-bottom:22px">
    <div class="box">
      <div class="bh">小标题一</div>
      <p>正文占位内容，居中排版，一段两三行即可，需要强调的词用 <b>红字</b>。</p>
    </div>
    <div class="box">
      <div class="bh">小标题二</div>
      <p>正文占位内容，居中排版，避免堆砌，讲清一件事。</p>
    </div>
    <div class="box">
      <div class="bh">小标题三</div>
      <p>正文占位内容，居中排版，风格素净、单一红强调。</p>
    </div>
  </div>

  <div class="axis">
    <span class="chip">标签占位一</span>
    <span class="chip">标签占位二</span>
    <span class="chip">标签占位三</span>
  </div>

  <div class="note"><b>标注：</b>底部说明占位，可放口径待定、来源备注等。</div>
</div>
</body></html>
